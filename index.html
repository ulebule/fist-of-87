  #zMove{left:0;width:46%;}

  #hintL{left:2%;width:42%;bottom:6%;}
  #hintR{right:2%;width:50%;bottom:6%;}
  @media (hover:hover) and (pointer:fine){#pad{display:none;}#padhint{display:none!important;}}

  #tb button{font-family:"Courier New",monospace;font-weight:bold;

    border:2px solid #3a4a99;cursor:pointer;border-radius:4px;}
  #tb button:active{transform:translateY(2px);}
  @media (pointer:coarse){
    #tb{gap:9px;}
    #tb button{min-width:46px;min-height:46px;padding:0 12px;font-size:14px;}

  try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; }
}

function text(t,x,y,size,col,align,weight){
  X.fillStyle=col; X.textAlign=align||'center'; X.textBaseline='middle';
  X.font=(weight||'bold')+' '+size+'px "Courier New",monospace';
  X.fillText(t,x,y);
}
function shadowText(t,x,y,size,col,align){
  X.fillStyle='#000'; X.textAlign=align||'center'; X.textBaseline='middle';
  X.font='bold '+size+'px "Courier New",monospace';
  X.fillText(t,x+2,y+2);
  X.fillStyle=col; X.fillText(t,x,y);
}

function detectLang(){
  try{
    const saved=safeLS('fist_lang'); if(saved&&LANGS.includes(saved)) return saved;
    const list=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||'en'];
    for(const raw of list){ const l=String(raw).slice(0,2).toLowerCase(); if(LANGS.includes(l)) return l; }
  }catch(e){}
  return 'en';
}
let lang=detectLang();
function T(k){ return (STR[lang]&&STR[lang][k]) || STR.en[k] || k; }

/* ---------------- audio ---------------- */
let AC=null, muted=(safeLS('fist_mute')==='1');
function ac(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC&&AC.state==='suspended'){ try{ AC.resume(); }catch(e){} }
  return AC;
}
function beep(f,dur,type,vol,slideTo){
  if(muted) return;
  const a=ac(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||'square'; o.frequency.value=f;
  const t=a.currentTime;
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo),t+(dur||0.08));
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.05,t+0.005);
  g.gain.exponentialRampToValueAtTime(0.0001,t+(dur||0.08));
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+(dur||0.08)+0.02);
}
function noise(dur,vol){
  if(muted) return;
  const a=ac(); if(!a) return;
  const n=Math.floor(a.sampleRate*(dur||0.08));
  const buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource(), g=a.createGain();
  s.buffer=buf; g.gain.value=vol||0.06;
  s.connect(g); g.connect(a.destination); s.start();
}

  jump:  ()=>beep(300,0.10,'square',0.035,620),

  ko:    ()=>[300,220,160,110].forEach((f,i)=>setTimeout(()=>beep(f,0.26,'sawtooth',0.07),i*130)),
  bell:  ()=>{beep(880,0.12,'square',0.05); setTimeout(()=>beep(1320,0.16,'square',0.05),110);},
  menu:  ()=>beep(520,0.05,'square',0.035),
  win:   ()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.18,'square',0.05),i*120)),
  brick: ()=>{noise(0.06,0.08); beep(240,0.06,'square',0.04,120);}

/* ---------------- input ---------------- */
const K={};                       // raw key state
const P=[null,null];              // the two player control blocks
function newCtl(){ return {left:0,right:0,up:0,down:0,punch:0,kick:0,spec:0,
                           punchEdge:0,kickEdge:0,specEdge:0,jumpEdge:0}; }
P[0]=newCtl(); P[1]=newCtl();

const KEYMAP=[
  {left:['KeyA'],right:['KeyD'],up:['KeyW'],down:['KeyS'],
   punch:['KeyF'],kick:['KeyG'],spec:['KeyH']},
  {left:['ArrowLeft'],right:['ArrowRight'],up:['ArrowUp'],down:['ArrowDown'],
   punch:['Comma','Numpad1'],kick:['Period','Numpad2'],spec:['Slash','Numpad3']}
];
function applyKeys(){
  for(let i=0;i<2;i++){
    const m=KEYMAP[i], c=P[i];
    if(touchOnly && i===0) continue;              // touch drives P1 on a phone
    /* held state only — the edges are captured in keydown, so a tap shorter
       than one frame is never lost */
    for(const act of ['left','right','up','down','punch','kick','spec'])
      c[act]=m[act].some(code=>K[code])?1:0;
  }
}
let touchOnly=false;
addEventListener('keydown',e=>{
  if(overlayOpen) return;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','Enter','Comma','Period','Slash'].includes(e.code)) e.preventDefault();
  const fresh=!K[e.code];
  K[e.code]=1; ac();
  if(fresh){
    for(let i=0;i<2;i++){
      if(touchOnly&&i===0) continue;
      const m=KEYMAP[i];
      if(m.punch.includes(e.code)) P[i].punchEdge=1;
      if(m.kick.includes(e.code))  P[i].kickEdge=1;
      if(m.spec.includes(e.code))  P[i].specEdge=1;
      if(m.up.includes(e.code))    P[i].jumpEdge=1;
    }
  }
  if(e.repeat) return;
  hotKey(e);
});
addEventListener('keyup',e=>{ K[e.code]=0; });
addEventListener('blur',()=>{ for(const k in K) K[k]=0; });

const zMove=document.getElementById('zMove'), zHit=document.getElementById('zHit');
const padhint=document.getElementById('padhint');
const DEAD=14, SWIPE=26;
let mv={id:null,x0:0,y0:0,x:0,y:0};
function moveStart(t){ mv.id=t.identifier; mv.x0=t.clientX; mv.y0=t.clientY; mv.x=t.clientX; mv.y=t.clientY; }
function moveUpdate(t){
  mv.x=t.clientX; mv.y=t.clientY;
  const c=P[0], dx=mv.x-mv.x0, dy=mv.y-mv.y0;
  c.left = dx<-DEAD?1:0;
  c.right= dx> DEAD?1:0;
  if(dy<-SWIPE){ if(!c.up) c.jumpEdge=1; c.up=1; mv.y0=mv.y+SWIPE; }
  else c.up=0;
  c.down = dy> DEAD?1:0;
}
function moveEnd(){ mv.id=null; const c=P[0]; c.left=c.right=c.up=c.down=0; }

let ht={id:null,x0:0,y0:0,t0:0,used:false};
function hitStart(t){ ht.id=t.identifier; ht.x0=t.clientX; ht.y0=t.clientY; ht.t0=perf; ht.used=false; }
function hitUpdate(t){
  if(ht.used) return;
  const dx=t.clientX-ht.x0, dy=t.clientY-ht.y0;
  const c=P[0];
  if(dy<-SWIPE && Math.abs(dy)>Math.abs(dx)){ c.kickEdge=1; ht.used=true; sfxTouch(); return; }
  if(Math.abs(dx)>SWIPE*1.6 && Math.abs(dx)>Math.abs(dy)){ c.specEdge=1; ht.used=true; sfxTouch(); return; }
}
function hitEnd(t){
  if(!ht.used && (perf-ht.t0)<320){ P[0].punchEdge=1; sfxTouch(); }
  ht.id=null; ht.used=false;
}
function sfxTouch(){ ac(); }
function bindZone(el,onStart,onMove,onEnd,which){
  el.addEventListener('touchstart',e=>{
    e.preventDefault(); touchOnly=true; ac();
    for(const t of e.changedTouches){
      if(which==='move'&&mv.id===null) onStart(t);
      if(which==='hit'&&ht.id===null) onStart(t);
    }
    if(state!=='fight'&&state!=='bonus') anyTap();
  },{passive:false});
  el.addEventListener('touchmove',e=>{
    e.preventDefault();
    for(const t of e.changedTouches){
      if(which==='move'&&t.identifier===mv.id) onMove(t);
      if(which==='hit'&&t.identifier===ht.id) onMove(t);
    }
  },{passive:false});
  const end=e=>{
    e.preventDefault();
    for(const t of e.changedTouches){
      if(which==='move'&&t.identifier===mv.id) onEnd(t);
      if(which==='hit'&&t.identifier===ht.id) onEnd(t);
    }
  };
  el.addEventListener('touchend',end,{passive:false});
  el.addEventListener('touchcancel',end,{passive:false});
}
bindZone(zMove,moveStart,moveUpdate,moveEnd,'move');
bindZone(zHit,hitStart,hitUpdate,hitEnd,'hit');

function makeFighter(def,side,isCPU){
  return {
    def, side, cpu:!!isCPU,
    x: side===0? 190 : 450, y:GROUND, vx:0, vy:0,
    face: side===0?1:-1,
    st:'idle', t:0, hp:100, stun:0, atk:null, hitDone:false,
    blockT:0, wins:0, flash:0, shots:[],
    ai:{think:0, want:'approach', hold:0}
  };
}
let f1=null,f2=null,shots=[];

const ATT={
  punch:{startup:0.07,active:0.09,recover:0.16,dmg:7, reach:50,hy:-86,hh:24,kb:70, sfx:'hit'},
  kick: {startup:0.11,active:0.12,recover:0.24,dmg:11,reach:66,hy:-62,hh:30,kb:120,sfx:'hit'},
  low:  {startup:0.09,active:0.10,recover:0.20,dmg:8, reach:56,hy:-26,hh:22,kb:80, sfx:'hit'},
  upper:{startup:0.09,active:0.16,recover:0.34,dmg:16,reach:46,hy:-100,hh:70,kb:150,sfx:'heavy'},
  dash: {startup:0.12,active:0.20,recover:0.30,dmg:14,reach:60,hy:-72,hh:40,kb:140,sfx:'heavy'},
  /* the projectile special: the pose itself never touches anybody — the shot it
     throws does the damage, so the hitbox is empty on purpose */
  wave: {startup:0.16,active:0.06,recover:0.34,dmg:0, reach:0, hy:-80,hh:10,kb:0,  sfx:'hit'}
};

function startAttack(f,kind){
  if(f.st==='hit'||f.st==='ko') return;
  if(f.st==='punch'||f.st==='kick'||f.st==='special') return;
  if(f.def.nokick && kind==='kick') kind='punch';
  const crouch = f.st==='crouch';
  let type=kind==='punch'?'punch':(kind==='kick'?'kick':f.def.special);
  if(crouch && kind!=='spec') type='low';
  f.atk={type, kind, phase:0, crouch};
  f.st = kind==='spec' ? 'special' : kind;
  f.t=0; f.hitDone=false;
  if(kind==='spec'){
    if(f.def.special==='wave'){ sfx.fire(); }
    else sfx.swing();
  } else sfx.swing();
}
function spawnWave(f){
  shots.push({x:f.x+f.face*34, y:GROUND-78, vx:f.face*300, owner:f, life:2.2,
              col:f.def.trim, r:11});
}

function attInfo(f){
  if(!f.atk) return null;
  const a=ATT[f.atk.type]; if(!a) return null;
  const total=a.startup+a.active+a.recover;
  return {a,total};
}

function fighterUpdate(f,other,dt,ctl){
  if(f.st==='ko'){ f.t+=dt; f.vx*=0.9; f.x+=f.vx*dt; keepIn(f); return; }
  f.t+=dt;
  if(f.flash>0) f.flash=Math.max(0,f.flash-dt*5);

  /* face the opponent unless committed */
  if(f.st==='idle'||f.st==='walk'||f.st==='crouch') f.face = other.x>f.x?1:-1;

  if(f.st==='hit'){
    f.vx*=0.86; f.x+=f.vx*dt;
    if(f.y<GROUND){ f.vy+=1500*dt; f.y+=f.vy*dt; if(f.y>=GROUND){f.y=GROUND;f.vy=0;} }
    if(f.t>f.stun){ f.st='idle'; f.t=0; }
    keepIn(f); return;
  }

  const speed=170*f.def.speed;
  const grounded=f.y>=GROUND-0.5;

  if(f.st==='punch'||f.st==='kick'||f.st==='special'){
    const info=attInfo(f);
    if(!info){ f.st='idle'; f.t=0; }
    else{
      if(f.atk.kind==='spec'&&f.def.special==='dash'&&f.t>info.a.startup&&f.t<info.a.startup+info.a.active)
        f.x+=f.face*260*dt;
      if(f.atk.kind==='spec'&&f.def.special==='wave'&&!f.hitDone&&f.t>=info.a.startup){
        spawnWave(f); f.hitDone=true;
      }
      if(f.t>=info.total){ f.st=grounded?'idle':'jump'; f.t=0; f.atk=null; f.hitDone=false; }
    }
    if(!grounded){ f.vy+=1500*dt; f.y+=f.vy*dt; f.x+=f.vx*dt;
      if(f.y>=GROUND){ f.y=GROUND; f.vy=0; f.vx=0; } }
    keepIn(f); return;
  }

  if(!grounded){                                  /* airborne */
    f.vy+=1500*dt; f.y+=f.vy*dt; f.x+=f.vx*dt;
    if(f.y>=GROUND){ f.y=GROUND; f.vy=0; f.vx=0; f.st='idle'; f.t=0; }
    if(ctl.punchEdge||ctl.kickEdge) startAttack(f, ctl.kickEdge?'kick':'punch');
    keepIn(f); return;
  }

  /* grounded and free */
  let moving=false;
  const back = (other.x>f.x)? 'left':'right';
  f.blockT = (ctl[back] || ctl.down) ? 0.14 : 0;

  if(ctl.jumpEdge){ f.vy=-560; f.y-=1; f.vx=(ctl.left?-1:ctl.right?1:0)*speed*0.9; f.st='jump'; f.t=0; sfx.jump(); }
  else if(ctl.punchEdge) startAttack(f,'punch');
  else if(ctl.kickEdge)  startAttack(f,'kick');
  else if(ctl.specEdge)  startAttack(f,'spec');
  else if(ctl.down){ f.st='crouch'; f.t=Math.min(f.t,1); }
  else{
    if(ctl.left){ f.x-=speed*dt*(f.face<0?1:0.72); moving=true; }
    if(ctl.right){ f.x+=speed*dt*(f.face>0?1:0.72); moving=true; }
    f.st = moving?'walk':'idle';
  }
  keepIn(f);
}
function keepIn(f){
  f.x=clamp(f.x,40,W-40);
}

/* attack hitbox in world space */
function hitboxOf(f){
  const info=attInfo(f); if(!info) return null;
  if(f.t<info.a.startup || f.t>info.a.startup+info.a.active) return null;
  if(f.atk.kind==='spec'&&f.def.special==='wave') return null;   // the wave does the hitting
  const a=info.a, R=a.reach*f.def.reach;
  const y=f.y+a.hy*(f.atk.crouch?0.6:1);
  return {x: f.face>0? f.x+10 : f.x-10-R, y:y-a.hh/2, w:R, h:a.hh, dmg:a.dmg*f.def.power, kb:a.kb, sfx:a.sfx};
}
function bodyOf(f){
  const w=38*f.def.build, h=(f.st==='crouch'?74:118);
  return {x:f.x-w/2, y:f.y-h, w, h};
}
const overlap=(a,b)=>a&&b&&a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

function applyHit(att,def,dmg,kb,snd,fromX){
  const blocking = def.blockT>0 && def.st!=='jump' && Math.sign(fromX-def.x)===def.face;
  if(blocking){
    def.hp-=Math.max(1,dmg*0.18); sfx.block();
    def.vx=Math.sign(def.x-fromX)*kb*0.4; def.st='hit'; def.stun=0.12; def.t=0;
    addSpark(def.x+def.face*18, def.y-78, '#7fd0ff');
  }else{
    def.hp-=dmg; def.flash=1;
    def.vx=Math.sign(def.x-fromX||1)*kb; def.st='hit'; def.stun=dmg>13?0.42:0.26; def.t=0;
    if(dmg>13) def.vy=-160, def.y-=1;
    (snd==='heavy'?sfx.heavy:sfx.hit)();
    addSpark(def.x+(fromX<def.x?-1:1)*-14, def.y-80, '#ffdd55');
    shake=Math.min(10,4+dmg*0.4);
  }
  def.hp=Math.max(0,def.hp);
  if(def.hp<=0){ def.st='ko'; def.t=0; def.vx=Math.sign(def.x-fromX||1)*160; def.vy=-260; }
}

  for(let i=0;i<9;i++) sparks.push({x,y,vx:(Math.random()*2-1)*180,vy:-Math.random()*180-40,

/* ---------------- AI ---------------- */
function aiControl(f,other,dt,level){
  const c=f.ctl||(f.ctl=newCtl());
  c.punchEdge=c.kickEdge=c.specEdge=c.jumpEdge=0;
  c.left=c.right=c.up=c.down=0;
  if(state!=='fight'||fightPhase!=='go') return c;

  const d=other.x-f.x, ad=Math.abs(d), dir=d>0?1:-1;
  const skill=clamp(0.35+level*0.075,0.35,1.0);
  f.ai.think-=dt;
  if(f.ai.think<=0){
    f.ai.think=(0.34-0.02*level)*(0.6+Math.random()*0.9);
    const r=Math.random();
    if(ad>150)            f.ai.want = r<0.75?'approach':'wait';
    else if(ad>86)        f.ai.want = r<0.40*f.def.aggro+0.25?'approach':(r<0.8?'poke':'wait');
    else                  f.ai.want = r<f.def.aggro?'attack':(r<f.def.aggro+f.def.guard*0.5?'guard':'retreat');
    if(Math.random()<f.def.jumpy*0.18*skill && ad>90) f.ai.want='jump';
    if(Math.random()<0.10*skill && ad>170 && f.def.special==='wave') f.ai.want='fire';
  }
  const w=f.ai.want;
  if(w==='approach'){ if(dir>0)c.right=1; else c.left=1; }
  else if(w==='retreat'){ if(dir>0)c.left=1; else c.right=1; }
  else if(w==='guard'){ if(dir>0)c.left=1; else c.right=1; if(Math.random()<0.4)c.down=1; }
  else if(w==='jump'){ c.jumpEdge=1; if(dir>0)c.right=1; else c.left=1; f.ai.want='approach'; }
  else if(w==='fire'){ c.specEdge=1; f.ai.want='wait'; }
  else if(w==='poke'){ if(dir>0)c.right=1; else c.left=1;
    if(ad<86+18*f.def.reach && Math.random()<0.5*skill) c.kickEdge=1; }
  else if(w==='attack'){
    const roll=Math.random();
    if(roll<0.45) c.punchEdge=1;
    else if(roll<0.8) c.kickEdge=1;
    else c.specEdge=1;
    f.ai.want='wait';
  }
  /* reactive guard: if the other is mid-attack and close, hold back sometimes */
  if(other.atk && ad<95 && Math.random()<f.def.guard*skill*0.35){
    c.punchEdge=c.kickEdge=c.specEdge=0;
    if(dir>0)c.left=1; else c.right=1;
  }
  return c;
}

/* ---------------- drawing the fighters ---------------- */
function seg(x1,y1,x2,y2,w,col){
  X.strokeStyle=col; X.lineWidth=w; X.lineCap='round';
  X.beginPath(); X.moveTo(x1,y1); X.lineTo(x2,y2); X.stroke();
}
function drawFighter(f){
  const d=f.def, s=f.face, b=d.build;
  const px=Math.round(f.x), py=Math.round(f.y);
  const crouch = f.st==='crouch' || (f.atk&&f.atk.crouch&&f.st!=='jump');
  const sc = crouch?0.68:1;
  const hipY = py-62*sc*b, shY = py-100*sc*b, headY = py-116*sc*b, headR=13*b;
  const t=f.t;
  const gi   = f.flash>0.3? '#ffffff' : d.gi;
  const giB  = f.flash>0.3? '#ffffff' : shade(d.gi,-38);
  const skin = f.flash>0.3? '#ffffff' : d.skin;
  const legW=14*b, armW=11*b;

  /* shadow */
  X.fillStyle='rgba(0,0,0,.35)';
  X.beginPath(); X.ellipse(px,GROUND+4,30*b,7,0,0,TAU); X.fill();

  /* ---- legs: a real stance, front foot forward ---- */
  let frontX=px+s*20, backX=px-s*18, kneeDrop=0;
  if(f.st==='walk'){ const w=Math.sin(t*9)*13; frontX=px+s*(18+w); backX=px-s*(16-w); }
  if(f.st==='jump'){ frontX=px+s*14; backX=px-s*6; kneeDrop=-18; }
  if(f.st==='ko'){ frontX=px+s*34; backX=px+s*6; kneeDrop=6; }
  if(crouch){ frontX=px+s*24; backX=px-s*22; }
  seg(px-s*5, hipY, backX,  py+kneeDrop, legW, giB);
  const kicking = f.st==='kick'&&f.atk;
  if(!kicking) seg(px+s*4, hipY, frontX, py+kneeDrop, legW, gi);

  /* ---- back arm (behind the torso) ---- */
  const shB=[px-s*9, shY+7], shF=[px+s*8, shY+7];
  let bx=px-s*13, by=shY+26;
  if(f.st==='walk'){ by=shY+22+Math.sin(t*9)*6; }
  if(f.st==='jump'){ bx=px-s*20; by=shY+2; }
  if(f.st==='ko'){ bx=px-s*30; by=shY+6; }
  seg(shB[0],shB[1], bx,by, armW, giB);
  X.fillStyle=shade(skin,-30); X.beginPath(); X.arc(bx,by,6.5*b,0,TAU); X.fill();

  /* ---- torso ---- */
  const lean = f.st==='ko'? -s*30 : (f.st==='walk'? s*2 : s*3);
  seg(px, hipY+3, px+lean, shY+2, 26*b, gi);
  X.fillStyle=d.belt; X.fillRect(px-13*b, hipY-4, 26*b, 7);
  X.fillStyle=d.trim;                      /* a slim lapel down the front */
  X.beginPath();
  X.moveTo(px+lean+s*2,  shY+3); X.lineTo(px+lean+s*10, shY+7);
  X.lineTo(px+s*7, hipY-3);      X.lineTo(px+s*1, hipY-3);
  X.closePath(); X.fill();

  /* ---- head ---- */
  const hx=px+lean*0.8+s*3, hy=headY+(f.st==='ko'?22:0);
  X.fillStyle=skin; X.beginPath(); X.arc(hx,hy,headR,0,TAU); X.fill();
  X.fillStyle=d.hair;                      /* hair cap, thicker at the back */
  X.beginPath(); X.arc(hx,hy-1,headR,Math.PI*1.02,Math.PI*2.08); X.fill();
  X.beginPath();
  X.ellipse(hx-s*headR*0.55, hy+headR*0.15, headR*0.55, headR*0.75, 0, 0, TAU);
  X.fill();
  if(d.band){ X.fillStyle=d.trim; X.fillRect(hx-headR, hy-headR*0.45, headR*2, 5); }
  if(f.st!=='ko'){ X.fillStyle='#101010'; X.fillRect(hx+s*4, hy-3, 3.5, 4); }
  else { X.strokeStyle='#101010'; X.lineWidth=2;
    X.beginPath(); X.moveTo(hx+s*2,hy-4); X.lineTo(hx+s*8,hy+2);
    X.moveTo(hx+s*8,hy-4); X.lineTo(hx+s*2,hy+2); X.stroke(); }

  /* ---- kicking leg, over the torso ---- */
  if(kicking){
    const i=attInfo(f), a=i.a;
    const ph = t<a.startup? t/a.startup*0.35
             : (t<a.startup+a.active? 1 : 1-(t-a.startup-a.active)/a.recover);
    const ext=clamp(ph,0,1)*(a.reach*d.reach);
    const ky = f.atk.crouch? py-16 : py-62*sc*b + (f.st==='jump'?10:-4);
    seg(px+s*4, hipY, px+s*(14+ext), ky, legW, gi);
    X.fillStyle=d.trim;
    X.beginPath(); X.arc(px+s*(14+ext), ky, 8*b, 0, TAU); X.fill();
  }

  /* ---- front arm, over the torso ---- */
  let fx=px+s*22, fy=shY+18;
  if(f.st==='walk'){ fy=shY+16-Math.sin(t*9)*6; }
  if(f.st==='jump'){ fx=px+s*24; fy=shY-6; }
  if(f.st==='ko'){ fx=px+s*10; fy=shY+30; }
  if(crouch){ fx=px+s*18; fy=shY+16; }
  if((f.st==='punch'||f.st==='special')&&f.atk){
    const i=attInfo(f), a=i.a;
    const ph = t<a.startup? t/a.startup*0.30
             : (t<a.startup+a.active? 1 : 1-(t-a.startup-a.active)/a.recover);
    const ext=clamp(ph,0,1)*(a.reach*d.reach);
    fx=px+s*(14+ext);
    fy=shY+ (f.atk.type==='upper'? 12-46*clamp(ph,0,1) : (f.atk.crouch?26:8));
  }
  seg(shF[0],shF[1], fx,fy, armW, gi);
  X.fillStyle=skin; X.beginPath(); X.arc(fx,fy,7*b,0,TAU); X.fill();
  X.fillStyle=d.trim; X.fillRect(fx-s*7*b, fy-4*b, s*4*b, 8*b);

  /* guard shimmer */
  if(f.blockT>0 && f.st!=='hit' && f.st!=='ko'){
    X.strokeStyle='rgba(127,208,255,.75)'; X.lineWidth=3;
    X.beginPath(); X.arc(px+s*18, py-66, 30, -1.15, 1.15); X.stroke();
  }
}
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)+amt, g=((n>>8)&255)+amt, b=(n&255)+amt;
  r=clamp(r,0,255); g=clamp(g,0,255); b=clamp(b,0,255);
  return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';
}

let state='boot', bootT=0, perf=0, last=0;
let mode=1;                       // 1 = tour, 2 = two players
let score=0, opp=0, round=1, timeLeft=60, fightPhase='intro', phaseT=0;

function beginTour(){
  mode=1; score=0; opp=0; f1def=byId('kai');
  startMatch(byId('kai'), byId(TOUR[0]), true);
}
let f1def=null;
function startMatch(defA,defB,cpuB){
  f1=makeFighter(defA,0,false);
  f2=makeFighter(defB,1,cpuB);
  f1.wins=0; f2.wins=0; round=1;
  shots=[]; sparks=[];
  state='fight'; fightPhase='intro'; phaseT=0; timeLeft=60;
  resultText='';
}
function newRound(){
  f1.hp=f2.hp=100;
  f1.x=190; f2.x=450; f1.y=f2.y=GROUND;
  f1.st=f2.st='idle'; f1.t=f2.t=0; f1.atk=f2.atk=null; f1.vx=f2.vx=0; f1.vy=f2.vy=0;
  f1.face=1; f2.face=-1;
  shots=[]; sparks=[];
  timeLeft=60; fightPhase='intro'; phaseT=0;
}
function endRound(winner){
  fightPhase='over'; phaseT=0;
  if(winner===1){ f1.wins++; resultText = (f2.hp<=0? T('ko') : T('timeup')); if(f1.hp>=100) resultText=T('perfect');
                  score += 1000 + Math.ceil(timeLeft)*20 + (f1.hp>=100?2000:0); }
  else if(winner===2){ f2.wins++; resultText = (f1.hp<=0? T('ko') : T('timeup')); }
  else { resultText=T('draw'); f1.wins++; f2.wins++; }
  sfx.ko();
}
function matchDone(){
  if(mode===2){
    state='matchover'; phaseT=0;
    resultText = f1.wins>f2.wins? T('p1win') : (f2.wins>f1.wins? T('p2win') : T('draw'));
    sfx.win(); return;
  }
  if(f1.wins>f2.wins){
    score+=3000; opp++;
    if(opp>=TOUR.length){ state='champion'; phaseT=0; sfx.win(); submitScore(); return; }
    if(opp===4||opp===8){ startBonus(); return; }
    startMatch(f1def, byId(TOUR[opp]), true);
  }else{
    state='gameover'; phaseT=0; sfx.ko(); submitScore();
  }
}

/* ---------------- bonus stage ---------------- */
function startBonus(){
  state='bonus'; phaseT=0;
  bonus={t:0, pos:0, dir:1, broken:0, left:6, hitT:0, done:false, msg:''};
  sfx.bell();
}
function bonusUpdate(dt,ctl){
  const b=bonus; b.t+=dt;
  if(b.done){ if(b.t>2.4 && (ctl.punchEdge||ctl.kickEdge||K.Enter)) nextAfterBonus(); return; }
  b.pos+=b.dir*dt*1.35; if(b.pos>1){b.pos=1;b.dir=-1;} if(b.pos<0){b.pos=0;b.dir=1;}
  if(b.hitT>0) b.hitT-=dt;
  if(ctl.punchEdge||ctl.kickEdge||ctl.specEdge){
    const acc=1-Math.abs(b.pos-0.5)*2;              // 1 in the middle, 0 at the edges
    b.left--;
    if(acc>0.72){ b.broken++; score+=500; b.hitT=0.25; b.msg='+500'; sfx.brick(); }
    else if(acc>0.42){ score+=150; b.hitT=0.18; b.msg='+150'; sfx.hit(); }
    else { b.msg='—'; sfx.block(); }
    if(b.left<=0){ b.done=true; b.t=0; }
  }
}
function nextAfterBonus(){
  startMatch(f1def, byId(TOUR[opp]), true);
}

async function loadBoard(){

  boardState='loading';
  try{

      orderBy:[{field:{fieldPath:'score'},direction:'DESCENDING'}],limit:10}};
    const r=await fetch(FB_BASE+':runQuery?key='+FB_KEY,{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(q),cache:'no-store'});
    if(!r.ok) throw 0;
    const d=await r.json();
    boardRows=d.filter(x=>x.document).map(x=>{
      const f=x.document.fields||{};
      return {n:((f.name&&f.name.stringValue)||'?').toUpperCase().slice(0,12),
              s:parseInt((f.score&&f.score.integerValue)||0,10)||0,
              l:parseInt((f.level&&f.level.integerValue)||0,10)||0};});
    boardState='ok';
  }catch(e){ boardState='error'; boardRows=null; }
}
async function submitOnline(name,sc,lv){
  if(!fbReady()) return false;
  try{
    const body={fields:{
      name:{stringValue:(name||'???').slice(0,12)},
      score:{integerValue:String(sc|0)},

    const r=await fetch(FB_BASE+'/'+FB_COL+'?key='+FB_KEY,{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});

/* ---------------- global keys ---------------- */
function hotKey(e){
  const k=e.key;
  if(state==='title'||state==='gameover'||state==='champion'||state==='matchover'){
    if(k==='l'||k==='L') { cycleLang(); return; }
    if(k==='n'||k==='N') { openName(); return; }
  }
  if(k==='m'||k==='M'){ toggleMute(); return; }
  if(k==='Enter'||k===' ') anyTap();
  if(state==='title'&&(k==='2')) { mode=2; state='select'; selWho=0; selP1=0; selP2=1; sfx.menu(); }
  if(state==='bonus'&&bonus&&bonus.done) nextAfterBonus();
}
function anyTap(){
  if(inputLock>0) return;
  ac();
  if(state==='boot'){ state='title'; return; }
  if(state==='title'){
    if(!playerName){ openName(); return; }
    beginTour(); inputLock=0.35; return;
  }
  if(state==='select'){
    if(selWho===0){ selWho=1; sfx.menu(); }
    else{ mode=2; startMatch(FIGHTERS[selP1],FIGHTERS[selP2],false); inputLock=0.35; }
    return;
  }
  if(state==='gameover'||state==='champion'||state==='matchover'){ state='title'; inputLock=0.35; loadBoard(); return; }
}

/* ---------------- update ---------------- */
function update(dt){
  perf+=dt*1000;
  if(inputLock>0) inputLock-=dt;
  if(shake>0) shake=Math.max(0,shake-dt*40);
  for(const s of sparks){ s.age+=dt; s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=700*dt; }
  sparks=sparks.filter(s=>s.age<s.life);

  applyKeys();

  if(state==='boot'){ bootT+=dt; if(bootT>3.2) state='title'; }

  if(state==='select'){
    const c = selWho===0? P[0] : P[1];      /* whoever is choosing drives the cursor */
    if(c.left&&!selHold){ selHold=1; pickMove(-1); }
    else if(c.right&&!selHold){ selHold=1; pickMove(1); }
    else if(!c.left&&!c.right) selHold=0;
    if(c.punchEdge||c.kickEdge||P[0].punchEdge) anyTap();
  }

  if(state==='fight'){
    phaseT+=dt;
    if(fightPhase==='intro'){
      if(phaseT>1.1){ fightPhase='go'; phaseT=0; sfx.bell(); }
    }else if(fightPhase==='go'){
      timeLeft-=dt;
      const c1=P[0];
      const c2 = f2.cpu? aiControl(f2,f1,dt,opp) : P[1];
      fighterUpdate(f1,f2,dt,c1);
      fighterUpdate(f2,f1,dt,c2);
      /* attacks */
      checkHit(f1,f2); checkHit(f2,f1);
      updateShots(dt);
      /* separation */
      const minD=30*(f1.def.build+f2.def.build)/2;
      if(Math.abs(f1.x-f2.x)<minD){
        const push=(minD-Math.abs(f1.x-f2.x))/2, s=f1.x<f2.x?1:-1;
        f1.x-=s*push; f2.x+=s*push; keepIn(f1); keepIn(f2);
      }
      if(f1.hp<=0||f2.hp<=0){
        endRound(f1.hp<=0? (f2.hp<=0?0:2) : 1);
      }else if(timeLeft<=0){
        endRound(f1.hp===f2.hp?0:(f1.hp>f2.hp?1:2));
      }
    }else{                                  /* round over */
      fighterUpdate(f1,f2,dt,newCtl());
      fighterUpdate(f2,f1,dt,newCtl());
      updateShots(dt);
      if(phaseT>2.6){
        if(f1.wins>=2||f2.wins>=2){ matchDone(); }
        else { round++; newRound(); }
      }
    }
    clearEdges();
    return;
  }

  if(state==='bonus'){ bonusUpdate(dt,P[0]); clearEdges(); return; }
  if(state==='gameover'||state==='champion'||state==='matchover'){ phaseT+=dt; }
  clearEdges();
}
let selHold=0;
function pickMove(d){
  sfx.menu();
  if(selWho===0) selP1=(selP1+d+FIGHTERS.length)%FIGHTERS.length;
  else selP2=(selP2+d+FIGHTERS.length)%FIGHTERS.length;
}
function clearEdges(){
  for(const c of P){ c.punchEdge=0; c.kickEdge=0; c.specEdge=0; c.jumpEdge=0; }
}
function checkHit(att,def){
  if(att.hitDone && att.atk && att.atk.kind!=='spec') return;
  const hb=hitboxOf(att); if(!hb) return;
  if(att.hitDone) return;
  if(overlap(hb,bodyOf(def))){
    att.hitDone=true;
    const scale = (att===f2 && f2.cpu && mode===1) ? (0.62+0.045*opp) : 1;
    applyHit(att,def,hb.dmg*scale,hb.kb,hb.sfx,att.x);
    if(att===f1) score+=Math.round(hb.dmg*10);
  }
}
function updateShots(dt){
  for(const s of shots){
    s.x+=s.vx*dt; s.life-=dt;
    const target = s.owner===f1? f2 : f1;
    if(overlap({x:s.x-s.r,y:s.y-s.r,w:s.r*2,h:s.r*2}, bodyOf(target))){
      applyHit(s.owner,target,12*s.owner.def.power,110,'hit',s.x);
      if(s.owner===f1) score+=120;
      s.life=0;
    }
  }
  shots=shots.filter(s=>s.life>0 && s.x>-30 && s.x<W+30);
}

/* ---------------- rendering ---------------- */
function render(){
  X.save();
  if(shake>0.4){ X.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake); }

  if(state==='boot'){ drawBoot(); X.restore(); return; }
  if(state==='title'){ drawTitle(); X.restore(); return; }
  if(state==='select'){ drawSelect(); X.restore(); return; }
  if(state==='bonus'){ drawBonus(); X.restore(); return; }

  const country = (f2&&f2.def.country)||'JAPAN';
  drawStage(country, perf/1000);
  for(const s of shots){
    X.fillStyle=s.col; X.beginPath(); X.arc(s.x,s.y,s.r,0,TAU); X.fill();
    X.fillStyle='rgba(255,255,255,.8)'; X.beginPath(); X.arc(s.x-4,s.y-4,s.r*0.35,0,TAU); X.fill();
  }
  if(f2) drawFighter(f2);
  if(f1) drawFighter(f1);
  for(const s of sparks){
    X.globalAlpha=1-s.age/s.life; X.fillStyle=s.col; X.fillRect(s.x,s.y,4,4); X.globalAlpha=1;
  }
  drawHUD();

  if(state==='fight'){
    if(fightPhase==='intro'){
      dim(0.35);
      shadowText(T('round')+' '+round, W/2, 150, 40, '#ffdd55');
      if(phaseT>0.7) shadowText(T('fight'), W/2, 210, 46, '#ff5533');
    }else if(fightPhase==='over'){
      dim(0.42);
      shadowText(resultText, W/2, 160, 48, '#ffdd55');
      if(mode===1&&f1.wins>=2&&opp+1<=TOUR.length&&phaseT>1.2)
        shadowText(T('opp')+' '+(opp+1)+' '+T('of')+' '+TOUR.length, W/2, 220, 16, '#9fb6ff');
    }
  }
  if(state==='gameover'){ dim(0.6); drawEnd(T('over'),'#ff4433'); }
  if(state==='champion'){ dim(0.6); drawEnd(T('champion'),'#ffdd55'); }
  if(state==='matchover'){ dim(0.6); drawEnd(resultText,'#ffdd55'); }
  X.restore();
}
function dim(a){ X.fillStyle='rgba(0,0,0,'+a+')'; X.fillRect(0,0,W,H); }

function drawEnd(title,col){
  shadowText(title,W/2,96,42,col);
  if(mode===1){
    shadowText((playerName||'???')+' — '+score, W/2, 146, 20, '#ffffff');
    shadowText(T('reached')+': '+opp+' / '+TOUR.length, W/2, 174, 14, '#9fb6ff');
    drawBoard(198,5);
    if(sendState) shadowText(sendState, W/2, 352, 11, '#8ef0a0');
  }
  if(Math.floor(perf/500)%2===0) shadowText(T('again'), W/2, 380, 15, '#8fa8d8');
}
function drawBoard(top,rows){
  if(boardState==='loading'){ shadowText(T('loading'),W/2,top+20,13,'#9fb6ff'); return; }
  const online = boardState==='ok' && boardRows && boardRows.length;
  const list = online? boardRows.slice(0,rows) : localScores.slice(0,rows);
  shadowText(T('board'),W/2,top,14,'#7fd0ff');
  X.fillStyle='rgba(127,208,255,.3)'; X.fillRect(W/2-150,top+12,300,1);
  if(!list.length){ shadowText('- - -',W/2,top+34,13,'#5f7ad0'); }
  list.forEach((h,i)=>{
    const y=top+34+i*20, mine=(h.n===playerName&&h.s===score);
    shadowText(String(i+1)+'.',W/2-140,y,13,mine?'#8ef0a0':'#5f7ad0','left');
    shadowText(h.n,W/2-112,y,13,mine?'#8ef0a0':'#dfe8ff','left');
    shadowText(String(h.s),W/2+140,y,13,mine?'#8ef0a0':'#ffdd55','right');
  });
  if(!online) shadowText(T('offline'),W/2,top+40+rows*20,10,'#ff9f6f');
}

function drawBoot(){
  X.fillStyle='#000'; X.fillRect(0,0,W,H);
  const lines=Math.min(14,Math.floor(bootT*7));
  X.fillStyle='#7fd0ff'; X.textAlign='left';
  X.font='bold 13px "Courier New",monospace';
  const rows=['ATARI ST  1 MB','','TOS 1.04','','LOADING  FIST87.PRG','',
              '  ####   ####  ####','  #      #     #   ',"  ###    ###   #   ",
              '  #      #     #   ','  #      ####  ####','','READY.'];
  for(let i=0;i<lines&&i<rows.length;i++) X.fillText(rows[i],40,60+i*20);
  if(bootT>2.2){
    X.fillStyle='#ffdd55';
    X.fillRect(40,60+13*20,Math.min(560,(bootT-2.2)*600),8);
  }
  if(Math.floor(bootT*3)%2===0) X.fillRect(40+8*((lines*7)%40),60+lines*20,9,14);
}

function drawTitle(){
  drawStage('JAPAN',perf/1000);
  dim(0.45);
  X.textAlign='center'; X.font='bold 54px "Courier New",monospace';
  const wF=X.measureText('FIST ').width, wO=X.measureText("OF '87").width;
  const x0=W/2-(wF+wO)/2;
  shadowText('FIST', x0+wF/2, 74, 54, '#ffdd55');
  shadowText("OF '87", x0+wF+wO/2, 74, 54, '#ff5533');
  shadowText(T('sub'),W/2,106,12,'#7fd0ff');

  shadowText(T('player')+': '+(playerName||'???'),W/2,140,15,'#8ef0a0');
  shadowText(T('chname'),W/2,159,10,'#5f7ad0');

  drawBoard(186,4);

  if(Math.floor(perf/500)%2===0) shadowText(T('start'),W/2,338,16,'#ffffff');
  shadowText(T('choose'),W/2,358,11,'#9fb6ff');
  shadowText(touchOnly? T('touchR').replace(/\n/g,'   ') : T('keys1'),W/2,380,9.5,'#5f7ad0');
}

function drawSelect(){
  drawStage('CHINA',perf/1000);
  dim(0.5);
  shadowText(T('select'),W/2,34,22,'#ffdd55');
  const cols=FIGHTERS.length, cw=W/cols;
  for(let i=0;i<cols;i++){
    const x=cw*i+cw/2, f=FIGHTERS[i];
    const on1=i===selP1, on2=i===selP2;
    X.fillStyle= on1?'rgba(255,221,85,.25)': on2?'rgba(127,208,255,.25)':'rgba(0,0,0,.35)';
    X.fillRect(cw*i+3,62,cw-6,86);
    X.fillStyle=f.gi; X.fillRect(x-11,84,22,40);
    X.fillStyle=f.skin; X.beginPath(); X.arc(x,76,11,0,TAU); X.fill();
    X.fillStyle=f.trim; X.fillRect(x-9,100,18,5);
    shadowText(f.name,x,140,9,on1?'#ffdd55':(on2?'#7fd0ff':'#9fb6ff'));
  }
  shadowText(T('p1pick')+': '+FIGHTERS[selP1].name,W/2-140,178,14,'#ffdd55');
  shadowText(T('p2pick')+': '+FIGHTERS[selP2].name,W/2+140,178,14,'#7fd0ff');
  shadowText(selWho===0? T('p1pick') : T('p2pick'),W/2,214,20,'#ffffff');
  shadowText(T('keys1'),W/2,300,10,'#5f7ad0');
  shadowText(T('keys2'),W/2,318,10,'#5f7ad0');
  if(Math.floor(perf/400)%2===0) shadowText(T('ready'),W/2,352,16,'#8ef0a0');
}

function drawBonus(){
  drawStage('USA',perf/1000);
  dim(0.35);
  shadowText(T('bonus'),W/2,44,26,'#ffdd55');
  shadowText(T('bonusdesc'),W/2,72,12,'#9fb6ff');
  const b=bonus;
  /* the stack */
  for(let i=0;i<6;i++){
    const broken=i<b.broken;
    X.fillStyle=broken?'rgba(90,60,40,.35)':'#a86a3a';
    X.fillRect(W/2-70,140+i*22,140,18);
    X.fillStyle=broken?'rgba(0,0,0,.3)':'rgba(0,0,0,.25)';
    X.fillRect(W/2-70,140+i*22+14,140,4);
  }
  /* the sweep meter */
  const mx=W/2-150, mw=300;
  X.fillStyle='#000'; X.fillRect(mx-3,300-3,mw+6,26);
  X.fillStyle='#2a2a44'; X.fillRect(mx,300,mw,20);
  X.fillStyle='#33cc44'; X.fillRect(mx+mw*0.36,300,mw*0.28,20);
  X.fillStyle='#ffdd55'; X.fillRect(mx+mw*0.46,300,mw*0.08,20);
  X.fillStyle='#ffffff'; X.fillRect(mx+mw*b.pos-2,296,4,28);
  shadowText(T('bonusres')+': '+b.broken,W/2,344,15,'#ffffff');
  if(b.msg&&b.hitT>0) shadowText(b.msg,W/2,270,20,'#ffdd55');
  if(b.done && Math.floor(perf/400)%2===0) shadowText(T('cont'),W/2,376,14,'#8ef0a0');
}

/* ---------------- loop ---------------- */
function frame(ts){
  requestAnimationFrame(frame);
  if(!last) last=ts;
  let dt=(ts-last)/1000; last=ts;
  if(dt>0.05) dt=0.05;
  const N=2, h=dt/N;
  for(let i=0;i<N;i++) update(h);
  render();
  padhint.classList.toggle('on', touchOnly && (state==='title'||state==='fight'&&fightPhase==='intro'));
}

/* ---------------- boot ---------------- */
syncChrome();
loadBoard();
if(!playerName) { /* asked on the first START, not before the title is even seen */ }
requestAnimationFrame(frame);

/* test hook */
window.__game={
  FIGHTERS,TOUR,startMatch,beginTour,startBonus,newRound,
  get state(){return state;}, set state(v){state=v;},
  get fightPhase(){return fightPhase;}, set fightPhase(v){fightPhase=v;},
  get f1(){return f1;}, get f2(){return f2;},
  get score(){return score;}, get opp(){return opp;},
  get timeLeft(){return timeLeft;}, set timeLeft(v){timeLeft=v;},
  get boardState(){return boardState;},
  get bonus(){return bonus;},
  get touchOnly(){return touchOnly;}, set touchOnly(v){touchOnly=v;},
  get lang(){return lang;}, setLang:l=>{lang=l;syncChrome();},
  ctl:P, T,
  get _mv(){return mv;}, get _ht(){return ht;}
};
</script>
<script>
/* PWA: cache the game so it runs with no connection (see sw.js) */
(function(){
  if(!('serviceWorker' in navigator)) return;
  var ok = location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1';
  if(!ok) return;
  addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
})();
</script>
